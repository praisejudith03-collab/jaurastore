name: Restore Photos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no commit)"
        required: false
        default: "false"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pillow requests

      - name: Collect uploaded photos
        run: python3 collect_uploaded_photos.py --no-rebuild

      - name: Commit & push
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/products/ js/products-data.js data/catalog.json || true
          git diff --cached --quiet || git commit -m "chore: restore product photos"
          git push
