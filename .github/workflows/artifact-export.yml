name: Artifact export (read-only, one-off)

# Why this workflow exists
# ------------------------
# The migration-review sandbox cannot reach productionresultssa*.blob.core.windows.net
# or results-receiver.actions.githubusercontent.com (the hosts that serve Actions
# artifact and log downloads), so `gh run download` and log fetching fail from
# there. Git over github.com works, so this one-off job downloads the artifacts
# of an already-completed run and pushes the two JSON files to a throwaway
# scratch branch (with SHA256SUMS.txt) so the reviewer can fetch and verify them
# with plain git.
#
# What it does NOT do:
#   - never runs migrate_images.py or any migration code
#   - never touches Supabase (no SUPABASE_* secrets are referenced)
#   - never uploads images or writes image_url
#   - never touches main or any protected branch; only creates the scratch branch
#
# It only reads existing artifacts of a completed run. The scratch branch is
# deleted by the reviewer after verification.

on:
  push:
    branches: [arena/01a0805d-jaurastore]
    paths: ['.github/workflows/artifact-export.yml']

permissions:
  contents: write   # only to create the throwaway scratch branch with the artifacts
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "34207418484"
      SCRATCH_BRANCH: "scratch/artifacts-run-34207418484"
    steps:
      - uses: actions/checkout@v4

      - name: Download the artifacts of the completed dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "=== SOURCE RUN PROVENANCE ==="
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID" \
            --jq '{id, name, event, status, conclusion, head_branch, head_sha, created_at, run_attempt, triggering_actor: .triggering_actor.login}'
          echo "=== ARTIFACT METADATA ==="
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | {id, name, size_in_bytes, expired, created_at}'
          mkdir -p exported
          gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_REPO" --dir downloaded
          find downloaded -type f -exec cp {} exported/ \;
          echo "=== EXPORTED FILES ==="
          ls -la exported/
          cd exported
          sha256sum * | tee SHA256SUMS.txt
          echo "=== CONTENT HEADS ==="
          for f in *.json; do echo "--- $f (first 200 bytes) ---"; head -c 200 "$f"; echo; done

      - name: Push the artifacts to the scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stash the exported files outside the worktree: the orphan checkout
          # below resets it.
          mkdir -p /tmp/artifacts-export
          cp exported/* /tmp/artifacts-export/
          git checkout --orphan "$SCRATCH_BRANCH"
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/artifacts-export/* .
          git add SHA256SUMS.txt *.json
          git commit -m "Artifacts of dry-run 34207418484 (read-only export for review)" \
                     -m "$(cat /tmp/artifacts-export/SHA256SUMS.txt)"
          git push --force origin "HEAD:refs/heads/${SCRATCH_BRANCH}"
          echo "Pushed artifacts to branch $SCRATCH_BRANCH"
