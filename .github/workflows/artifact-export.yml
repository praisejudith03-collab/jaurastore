name: Artifact export (read-only, one-off)

# Why this workflow exists
# ------------------------
# The migration-review sandbox cannot reach productionresultssa*.blob.core.windows.net
# (the host that serves Actions artifact downloads), so `gh run download` fails
# from there. This one-off job re-emits the artifacts of an already-completed
# run into its own job log (SHA-256 + base64 of the exact bytes) so the
# reviewer can verify integrity and inspect the JSON locally.
#
# What it does NOT do:
#   - never runs migrate_images.py or any migration code
#   - never touches Supabase (no SUPABASE_* secrets are referenced)
#   - never uploads images or writes image_url
#   - never commits or pushes anything (contents: read)
#
# It only reads existing artifacts of a completed run using the repository's
# own GITHUB_TOKEN with actions: read.

on:
  push:
    branches: [arena/01a0805d-jaurastore]
    paths: ['.github/workflows/artifact-export.yml']

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "34207418484"
    steps:
      - uses: actions/checkout@v4

      - name: Export artifacts of the completed dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_RUN_ID}" ]; then
            echo "No SOURCE_RUN_ID configured; nothing to do."
            exit 0
          fi

          echo "=== SOURCE RUN PROVENANCE ==="
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID" \
            --jq '{id, name, event, status, conclusion, head_branch, head_sha, created_at, run_attempt, triggering_actor: .triggering_actor.login}'

          echo "=== ARTIFACT METADATA ==="
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID/artifacts" \
            --jq '.artifacts[] | {id, name, size_in_bytes, expired, created_at}'

          mkdir -p artifacts
          gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_REPO" --dir artifacts

          echo "=== FILES ==="
          find artifacts -type f | sort | while read -r f; do echo "$f ($(wc -c < "$f") bytes)"; done

          find artifacts -type f | sort | while read -r f; do
            echo "### FILE-BEGIN: $f"
            echo "### SHA256: $(sha256sum "$f" | cut -d' ' -f1)"
            echo "### B64-BEGIN $f"
            base64 -w 4000 "$f" | nl -ba -w 4 -v 1 | sed 's/^/B64 /'
            echo "### B64-END $f"
            echo "### FILE-END: $f"
          done
