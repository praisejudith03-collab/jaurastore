name: Image migration (manual, protected)

# Why this workflow exists
# ------------------------
# The image migration writes to Supabase Storage and to products.image_url, so
# it needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. Those must never appear
# in source, in this file, in a commit, in a report, or in a chat log. This
# sandbox has neither credential (`gh secret list` returns HTTP 403), so the
# migration cannot and must not be run from here. It runs here instead, on a
# manual trigger, with the key held only as a repository secret.
#
# PROTECTION - configure once in the repository settings:
#   Settings -> Environments -> New environment "image-migration"
#     Required reviewers: add at least one human approver
#     Wait timer: 0
#   Settings -> Secrets and variables -> Actions, add:
#     SUPABASE_URL              (https://<project-ref>.supabase.co)
#     SUPABASE_SERVICE_ROLE_KEY (service_role JWT - server side only)
#
# Nothing runs until a reviewer approves the run, and a real apply needs BOTH
# dry_run=false AND confirm_apply=APPLY. Every run, dry or real, publishes the
# JSON report as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = plan only (zero uploads, zero DB writes). Set false ONLY after reviewing the report."
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]
      confirm_apply:
        description: "Type APPLY to permit a real run. Ignored while dry_run is true."
        required: false
        type: string
        default: ""
      limit:
        description: "Plan at most this many products (0 = all). Use a small number for a first real run."
        required: false
        type: string
        default: "0"
      live_only:
        description: "Restrict the plan to products currently online."
        required: false
        type: choice
        default: "false"
        options: ["true", "false"]

# One migration at a time. Two concurrent runs could both read the same
# products.image_url and race on the write.
concurrency:
  group: image-migration
  cancel-in-progress: false

permissions:
  contents: read          # read-only: this job never commits
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Gates the whole job behind required reviewers configured on the
    # "image-migration" environment.
    environment:
      name: image-migration
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: uploads          # never 'receipts'
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pillow requests

      # The service-role key is a bearer credential. Masking it here means a
      # stray traceback or HTTP error body cannot leak it into the log.
      - name: Mask the service-role key
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          fi

      - name: Fail fast if credentials are missing
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "The values are never printed here."
            exit 1
          fi
          echo "Credentials present. Length only (never the value):"
          echo "  SUPABASE_URL host: $(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://##; s#/.*##')"
          echo "  service key length: ${#SUPABASE_SERVICE_ROLE_KEY}"

      - name: Refuse a real run that was not explicitly confirmed
        if: inputs.dry_run == 'false' && inputs.confirm_apply != 'APPLY'
        run: |
          echo "::error::dry_run=false needs confirm_apply=APPLY."
          echo "Review the dry-run report artifact first, then re-run with both set."
          exit 1

      # Read-only. The migration writes products.image_url and Storage objects,
      # so the schema must already be applied. This probes every required table
      # for the exact columns the application uses and fails the run if one is
      # missing - cheaper than a half-applied migration.
      - name: Verify the Supabase schema is applied
        run: |
          python3 verify_schema.py --json schema-verification.json || {
            echo "::error::The schema is not fully applied. Run supabase_schema.sql in the Supabase SQL editor first."
            exit 1
          }

      - name: Publish the schema verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-verification
          path: schema-verification.json
          if-no-files-found: warn

      # A dry run always happens first, even when applying, so the artifact
      # for a real run still contains the pre-flight plan.
      - name: Dry-run plan (always, zero writes)
        run: |
          args=(--dry-run --report dry-run-report.json --bucket "$SUPABASE_BUCKET")
          [ "${{ inputs.limit }}" != "0" ] && args+=(--limit "${{ inputs.limit }}")
          [ "${{ inputs.live_only }}" = "true" ] && args+=(--live-only)
          python3 migrate_images.py "${args[@]}" || {
            code=$?
            echo "::error::migrate_images.py exited $code (2 = missing credentials, 3 = blockers)"
            exit $code
          }

      - name: Summarise the plan
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("dry-run-report.json"))
          p = r["products"]
          u = p["existing_https_urls"]
          print("=== DRY-RUN PLAN ===")
          print(f"data source        : {r['data_source']}")
          print(f"products examined  : {p['products_examined']}")
          print(f"products matched   : {p['products_matched']}")
          print(f"products skipped   : {p['products_skipped']}")
          print(f"images to upload   : {p['images_to_upload']}")
          print(f"already uploaded   : {p['images_already_uploaded']}")
          print(f"missing images     : {p['images_missing']}")
          print(f"duplicate rows     : {p['duplicate_row_count']}")
          print(f"existing HTTPS urls: {u['count']} "
                f"(uploads {u['already_public_supabase_uploads']}, "
                f"other host {u['other_https_host']}, "
                f"insecure http {u['insecure_http']}, "
                f"template {u['unresolved_template']})")
          print(f"legacy wix ids     : {len(p['legacy_id_references'])}")
          ls = r.get("live_set") or {}
          c = ls.get("counts") or {}
          print("--- live-product policy ---")
          print(f"source rows        : {ls.get('total_source_rows')}")
          print(f"valid image/price  : {ls.get('rows_with_a_valid_image')} / {ls.get('rows_with_a_valid_price')}")
          print(f"valid stock        : {ls.get('rows_with_valid_stock')}")
          print(f"APPROVED LIVE      : {ls.get('approved_live_count')}")
          print(f"operator offline   : {ls.get('operator_offline_ids')}")
          print(f"placeholder only   : {c.get('placeholder_only')}")
          print(f"fixtures excluded  : {c.get('test_fixtures_excluded')}")
          print(f"needs review       : {c.get('needs_review')}")
          print(f"applied by script  : {ls.get('applied_by_this_script')}")
          print(f"blockers           : {r['blockers'] or 'none'}")
          print(f"env blockers       : {r['environment_blockers'] or 'none'}")
          print(f"safe_to_apply      : {r['safe_to_apply']}")
          PY

      - name: Check the plan against the approved Supabase-source decision
        if: inputs.dry_run == 'true'
        run: |
          python3 - <<'PY'
          # Visibility only: a dry run must always publish its report, so this
          # never exits non-zero. It makes drift from the approved decision
          # loud at dry-run time instead of first surfacing at apply time.
          import json
          r = json.load(open("dry-run-report.json"))
          ls = r.get("live_set") or {}
          counts = ls.get("counts") or {}
          plan = r.get("products") or {}
          approved = {
              "total_source_rows": 53,
              "approved_live_count": 29,
              "placeholder_only": 3,
              "no_image": 2,
              "test_fixtures_excluded": 17,
              "needs_review": 0,
              "proposed_updates": 30,
              "duplicate_row_count": 0,
              "mapping_warnings": 0,
          }
          got = {
              "total_source_rows": ls.get("total_source_rows"),
              "approved_live_count": ls.get("approved_live_count"),
              "placeholder_only": counts.get("placeholder_only"),
              "no_image": counts.get("no_image"),
              "test_fixtures_excluded": counts.get("test_fixtures_excluded"),
              "needs_review": counts.get("needs_review"),
              "proposed_updates": len(plan.get("proposed_database_updates") or []),
              "duplicate_row_count": plan.get("duplicate_row_count"),
              "mapping_warnings": len(plan.get("mapping_warnings") or []),
          }
          offline = set(ls.get("operator_offline_ids") or [])
          proposed_ids = {u.get("match", {}).get("id")
                          for u in (plan.get("proposed_database_updates") or [])}
          print("=== APPROVED DECISION CHECK (source: live Supabase products, decided 2026-09-08) ===")
          drift = []
          for key in sorted(approved):
              ok = got.get(key) == approved[key]
              if not ok:
                  drift.append(key)
              print(f"  {'ok' if ok else 'DRIFT':5} {key:24} "
                    f"approved={approved[key]!r:5} actual={got.get(key)!r}")
          for wid in ("wix-001", "wix-012"):
              ok = wid in offline
              if not ok:
                  drift.append(wid)
              print(f"  {'ok' if ok else 'DRIFT':5} {wid:24} "
                    f"approved=offline actual={'offline' if wid in offline else 'NOT offline'}")
          ok = "wix-001" not in proposed_ids
          if not ok:
              drift.append("wix-001 image")
          print(f"  {'ok' if ok else 'DRIFT':5} {'wix-001 gets no image':24} "
                f"approved=True actual={'wix-001' not in proposed_ids}")
          if drift:
              print("::warning::The dry-run plan drifted from the approved "
                    "Supabase-source decision:", ", ".join(sorted(set(map(str, drift)))))
              print("::warning::A real run (dry_run=false) will be refused by the "
                    "apply guard until the decision is re-reviewed.")
          else:
              print("The plan matches the approved Supabase-source decision.")
          PY

      - name: Publish the dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-report
          path: dry-run-report.json
          if-no-files-found: error

      - name: Block the apply when the plan is not safe
        if: inputs.dry_run == 'false'
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("dry-run-report.json"))
          if not r.get("safe_to_apply"):
              print("::error::safe_to_apply is false - refusing to apply.")
              print("blockers:", r.get("blockers"))
              print("environment blockers:", r.get("environment_blockers"))
              sys.exit(1)

          # APPROVED SOURCE DECISION (2026-09-08): the live Supabase products
          # table is the approved migration source, and the numbers below are
          # the approved classification of that source (verified against the
          # SHA-256-checked dry-run artifacts of run 34207418484). The legacy
          # Wix seed classification documented in MIGRATION_REPORT.md belongs
          # to the legacy import analysis ONLY and is NOT the production
          # guard. If a data change moves any number, the run stops for a
          # human instead of publishing whatever the catalogue contains today.
          ls = r.get("live_set") or {}
          counts = ls.get("counts") or {}
          plan = r.get("products") or {}
          expected = {
              "total_source_rows": 53,
              "approved_live_count": 29,
              "placeholder_only": 3,
              "no_image": 2,
              "test_fixtures_excluded": 17,
              "needs_review": 0,
          }
          got = {
              "total_source_rows": ls.get("total_source_rows"),
              "approved_live_count": ls.get("approved_live_count"),
              "placeholder_only": counts.get("placeholder_only"),
              "no_image": counts.get("no_image"),
              "test_fixtures_excluded": counts.get("test_fixtures_excluded"),
              "needs_review": counts.get("needs_review"),
          }
          if got != expected:
              print("::error::The live-product classification no longer matches "
                    "the approved Supabase-source decision. Stop and re-review "
                    "before applying.")
              print("expected:", expected)
              print("actual  :", got)
              sys.exit(1)

          proposed = plan.get("proposed_database_updates") or []
          if len(proposed) != 30:
              print("::error::proposed_database_updates is", len(proposed),
                    "- the approved plan is exactly 30 image_url updates. "
                    "Stop and re-review before applying.")
              sys.exit(1)

          offline = set(ls.get("operator_offline_ids") or [])
          if not {"wix-001", "wix-012"} <= offline:
              print("::error::wix-001 and wix-012 must be classified offline.")
              print("operator_offline_ids:", sorted(offline))
              sys.exit(1)
          if set(ls.get("live_ids") or []) & {"wix-001", "wix-012"}:
              print("::error::wix-001 or wix-012 is in the approved live set.")
              sys.exit(1)

          # wix-001 has only the branded placeholder - it must never receive
          # an image_url. wix-012 has a real committed photo, so it MAY get
          # its real public uploads image while staying offline (priceNgn=0).
          by_id = {u.get("match", {}).get("id"): u for u in proposed}
          if "wix-001" in by_id:
              print("::error::wix-001 must not receive an image (placeholder only).")
              sys.exit(1)
          w12 = by_id.get("wix-012")
          if w12 is not None:
              url = str((w12.get("set") or {}).get("image_url") or "")
              if not (url.startswith("https://") and "/uploads/" in url):
                  print("::error::wix-012 may only receive its real public "
                        "uploads image, got:", url or "<empty>")
                  sys.exit(1)

          print("Classification matches the approved Supabase-source decision - proceeding.")
          print(f"  approved live     : {got['approved_live_count']}")
          print(f"  proposed updates  : {len(proposed)}")
          print(f"  operator offline  : {sorted(offline)}")
          PY

      - name: Apply (uploads + image_url writes)
        if: inputs.dry_run == 'false' && inputs.confirm_apply == 'APPLY'
        run: |
          args=(--report apply-report.json --bucket "$SUPABASE_BUCKET" --http-check)
          [ "${{ inputs.limit }}" != "0" ] && args+=(--limit "${{ inputs.limit }}")
          [ "${{ inputs.live_only }}" = "true" ] && args+=(--live-only)
          python3 migrate_images.py "${args[@]}" || {
            code=$?
            echo "::error::apply exited $code - see apply-report.json"
            exit $code
          }

      # The single artifact the reviewer signs off on: what was uploaded, what
      # was written, what was verified, and the proof that nothing else changed.
      - name: Build migration-result.json
        if: always() && inputs.dry_run == 'false'
        run: |
          python3 - <<'PY'
          import json, os
          apply_rep = {}
          if os.path.exists("apply-report.json"):
              apply_rep = json.load(open("apply-report.json"))
          dry_rep = {}
          if os.path.exists("dry-run-report.json"):
              dry_rep = json.load(open("dry-run-report.json"))
          s = apply_rep.get("safety") or dry_rep.get("safety") or {}
          ls = dry_rep.get("live_set") or {}
          p = apply_rep.get("products") or dry_rep.get("products") or {}
          # A real run puts the outcome under execution.products; a dry run has
          # no execution block at all, so every field below degrades to None
          # rather than pretending a number.
          ex = (apply_rep.get("execution") or {}).get("products") or {}
          result = {
              "mode": "apply" if apply_rep else "dry-run only",
              "generated_at": apply_rep.get("generated_at") or dry_rep.get("generated_at"),
              "bucket": apply_rep.get("bucket") or dry_rep.get("bucket"),
              "live_set": {
                  "approved_live_count": ls.get("approved_live_count"),
                  "operator_offline_ids": ls.get("operator_offline_ids"),
                  "counts": ls.get("counts"),
                  "applied_by_this_script": ls.get("applied_by_this_script"),
              },
              "plan": {
                  "products_examined": p.get("products_examined"),
                  "products_matched": p.get("products_matched"),
                  "images_to_upload": p.get("images_to_upload"),
                  "images_already_uploaded": p.get("images_already_uploaded"),
                  "images_missing": p.get("images_missing"),
                  "duplicate_row_count": p.get("duplicate_row_count"),
                  "proposed_database_updates": p.get("proposed_database_updates"),
              },
              "execution": {
                  "uploaded": ex.get("uploaded"),
                  "reused": ex.get("reused"),
                  "rows_updated": ex.get("rows_updated"),
                  "verified": ex.get("verified"),
                  "failed": ex.get("failed"),
                  "not_verified": ex.get("not_verified"),
              },
              "safety": s,
              "invariants": {
                  "writable_columns": s.get("writable_columns"),
                  "deletes_local_files": s.get("deletes_local_files"),
                  "deletes_storage_objects": s.get("deletes_storage_objects"),
                  "deletes_database_rows": s.get("deletes_database_rows"),
                  "inserts_database_rows": s.get("inserts_database_rows"),
                  "renames_product_ids": s.get("renames_product_ids"),
                  "writes_price_or_stock_columns": s.get("writes_price_or_stock_columns"),
                  "credentials_in_report": s.get("credentials_in_report"),
              },
              "blockers": apply_rep.get("blockers") or dry_rep.get("blockers"),
              "environment_blockers": (apply_rep.get("environment_blockers")
                                       or dry_rep.get("environment_blockers")),
          }
          with open("migration-result.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, indent=2, ensure_ascii=False)
          inv = result["invariants"]
          bad = [k for k, v in inv.items()
                 if k not in ("writable_columns", "credentials_in_report") and v]
          if bad:
              print("::error::A destructive invariant is true in the result:", bad)
              raise SystemExit(1)
          if inv.get("credentials_in_report"):
              print("::error::credentials_in_report is true - refusing to publish.")
              raise SystemExit(1)
          # An upload that was not verified means a row may now point at an
          # object that is not publicly readable. That is not a success.
          ex = result["execution"]
          if ex.get("uploaded") is not None and ex.get("not_verified"):
              print(f"::warning::{len(ex['not_verified'])} uploaded object(s) "
                    "could not be verified - check them before the visual pass.")
          print("migration-result.json written. Destructive invariants all false.")
          print(f"  uploaded={ex.get('uploaded')} reused={ex.get('reused')} "
                f"rows_updated={ex.get('rows_updated')} verified={ex.get('verified')}")
          PY

      - name: Publish the apply report
        if: always() && inputs.dry_run == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: apply-report
          path: apply-report.json
          if-no-files-found: warn

      - name: Publish migration-result.json
        if: always() && inputs.dry_run == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: migration-result
          path: migration-result.json
          if-no-files-found: warn

      # Reminder only. Local images are NOT deleted by this job or by the
      # script; they stay until the live visual check passes.
      - name: Post-run verification SQL
        if: always() && inputs.dry_run == 'false'
        run: |
          cat <<'SQL'
          Run these in the Supabase SQL editor after the job finishes.

          -- 1. Live catalogue health
          select
            count(*) as total_products,
            count(*) filter (where online = true) as live_products,
            count(*) filter (
              where online = true
                and image_url like 'https://%'
            ) as live_products_with_https_images,
            count(*) filter (
              where online = true
                and "priceNgn" is not null
            ) as live_products_with_ngn_prices,
            count(*) filter (
              where online = true
                and "priceCfa" is not null
            ) as live_products_with_cfa_prices,
            count(*) filter (
              where online = true
                and stock_quantity is not null
            ) as live_products_with_stock
          from public.products;

          -- 2. MUST return ZERO rows for the intended live catalogue
          select
            id,
            name,
            image_url,
            "priceNgn",
            "priceCfa",
            stock_quantity,
            online
          from public.products
          where online = true
          and (
            image_url is null
            or image_url not like 'https://%'
            or "priceNgn" is null
            or "priceCfa" is null
            or stock_quantity is null
          )
          order by id;

          -- 3. The two operator-offline products. Both MUST be online=false.
          select
            id,
            online,
            image_url,
            "priceNgn",
            "priceCfa",
            stock_quantity
          from public.products
          where id in ('wix-001', 'wix-012');
          SQL
