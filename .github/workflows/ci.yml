name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pyyaml enables workflow guards; pgserver bundles disposable PostgreSQL
        # for the delivery seed regression tests (no Supabase credentials).
        run: pip install -r requirements.txt pytest pillow pyyaml pgserver==0.1.4

      - name: Run test suite
        run: python -m pytest tests/ -q
