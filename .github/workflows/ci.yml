name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-test.txt is the declared source for Pillow (upload
        # tests), PyYAML (workflow guards) and pgserver (delivery seed
        # PostgreSQL). Do not rely on undeclared pip extras.
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install browser for mobile smoke tests
        run: python -m playwright install --with-deps chromium

      # TEMP-DEBUG (removed before merge): capture the failure summary and
      # post it to the PR so sandboxed environments without log access can
      # see which test failed.
      - name: Run test suite
        id: tests
        continue-on-error: true
        run: python -m pytest tests/ -q -rf --tb=line 2>&1 | tee /tmp/pytest.out

      - name: Report test failure summary to the PR
        if: always() && steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tail -n 30 /tmp/pytest.out > /tmp/pytest.tail || true
          {
            printf 'CI test failure summary (debug step):\n```\n'
            cat /tmp/pytest.tail
            printf '\n```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GH_REPO" --body-file /tmp/comment.md || true

      - name: Gate on the test suite
        if: steps.tests.outcome == 'failure'
        run: exit 1
