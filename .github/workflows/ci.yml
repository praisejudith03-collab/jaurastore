name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-test.txt is the declared source for Pillow (upload
        # tests), PyYAML (workflow guards) and pgserver (delivery seed
        # PostgreSQL). Do not rely on undeclared pip extras.
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install browser for mobile smoke tests
        run: python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m pytest tests/ -q
