name: CI

# One commit, one build.
#
# `push` is limited to main on purpose: every feature/release branch is
# covered by its pull_request run, and leaving push: unrestricted made GitHub
# start TWO builds per commit (a push build and a pull_request build of the
# same SHA). The duplicate was pure noise - and when a run failed, the twin
# kept the failure e-mail alive even after a fix had been pushed.
on:
  push:
    branches: [main]
  pull_request:
  # Escape hatch: run this workflow on any ref from the Actions tab.
  workflow_dispatch:

# A force-push (or a quick follow-up commit) cancels the superseded build
# instead of leaving a second, already-doomed run behind. Grouped per PR, so
# the post-merge main run is never cancelled by a branch run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # A hung test must fail the job in minutes, not burn the 6-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Warm the wheel cache between runs: the suite is ~2 minutes of
          # tests, and an uncached pip install of Pillow/pgserver/playwright
          # used to be a third of the job.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        # requirements-test.txt is the declared source for Pillow (upload
        # tests), PyYAML (workflow guards) and pgserver (delivery seed
        # PostgreSQL). Do not rely on undeclared pip extras.
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Install browser for mobile smoke tests
        run: python -m playwright install --with-deps chromium

      - name: Install jsdom and Acorn for browser-behaviour guards
        # jsdom drives the shipped accounting desk in a DOM; Acorn powers the
        # runtime helper-scope and exchange-rate harnesses. CI refuses skips,
        # so install both outside the checkout, which has no package.json on
        # purpose.
        run: npm install --no-save --prefix "$RUNNER_TEMP/ja-jsdom" jsdom acorn

      - name: Run test suite
        # The exact command lives in tools/ci_check.sh, which is what a human
        # (or an agent) runs locally before pushing - tests/test_ci_pipeline.py
        # fails the build if the two ever drift apart.
        env:
          # CI installs chromium above, so a missing browser here is a broken
          # build, not a reason to skip. Without this the mobile measurement
          # tests skip silently and the run reports green while measuring
          # nothing - the exact "green but untested" trap we are closing.
          JA_REQUIRE_BROWSER: "1"
          # Where the step above put jsdom; the DOM check reads it.
          JA_JSDOM_DIR: ${{ runner.temp }}/ja-jsdom
        run: bash tools/ci_check.sh --ci

      - name: Upload pytest report
        # always(): the report is the only readable failure detail when the
        # Actions log download endpoint is unavailable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

      # The Actions log download endpoint is not always reachable from the
      # sandbox. Surface the failing pytest node IDs and short failure messages
      # as check-run annotations as well as in the ordinary step log.
      - name: Report pytest failures
        if: failure()
        run: |
          python - <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-results.xml")
          if not report.exists():
              print("::error title=Pytest report::pytest-results.xml was not produced")
              sys.exit(0)

          root = ET.parse(report).getroot()
          failures = 0
          for case in root.iter("testcase"):
              for kind in ("failure", "error"):
                  result = case.find(kind)
                  if result is None:
                      continue
                  failures += 1
                  detail = result.get("message") or result.text or ""
                  detail = re.sub(r"\s+", " ", detail).strip()
                  name = f"{case.get('classname', '')}::{case.get('name', '')}"
                  message = f"{name}: {detail[:900]}"
                  message = (message.replace("%", "%25")
                                    .replace("\r", "%0D")
                                    .replace("\n", "%0A"))
                  print(f"::error title=pytest {kind}::{message}")
          if not failures:
              print("::error title=Pytest report::pytest failed, but the JUnit report contains no failure nodes")
          PY
