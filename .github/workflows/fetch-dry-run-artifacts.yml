name: Fetch migration artifacts (temporary, read-only)

# TEMPORARY read-only helper (tail pass): re-emits the last 60 b64 chars of the
# three artifacts whose previous fetch hit the 10-annotation cap. Read-only.

on:
  push:
    branches:
      - "arena/01a080a7-jaurastore"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fetch-migration-artifacts
  cancel-in-progress: false

jobs:
  tail-apply:
    name: tail-apply
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tail
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "34241484557"
          ART: "apply-report"
        run: |
          mkdir -p work
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts" > work/arts.json 2> work/err.log \
            || { echo "::error file=diag::gh api failed: $(head -c 300 work/err.log)"; exit 1; }
          id=$(python3 -c "import json,os; d=json.load(open('work/arts.json')); print(next((a['id'] for a in d['artifacts'] if a['name']==os.environ['ART']),''))")
          [ -z "$id" ] && { echo "::error file=diag::NOT-FOUND $ART"; exit 0; }
          curl -fsSL --retry 3 --max-time 300 -H "Authorization: Bearer $GH_TOKEN" \
            -o "work/$ART.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
            || { echo "::error file=diag::curl failed"; exit 1; }
          mkdir -p "work/$ART"
          unzip -o -q "work/$ART.zip" -d "work/$ART"
          python3 - "$ART" <<'PY'
          import base64, glob, os, sys
          art = sys.argv[1]
          files = [f for f in sorted(glob.glob(f"work/{art}/**/*", recursive=True))
                   if os.path.isfile(f) and os.path.getsize(f)]
          if not files:
              print("no files")
              sys.exit(0)
          data = b"\n".join(open(f, "rb").read() for f in files)
          b64 = base64.b64encode(data).decode("ascii")
          tail = b64[-60:]
          sys.stderr.write(f"::error file=tail::total={len(b64)} filebytes={len(data)} tail60={tail}\n")
          print(f"{art}: filebytes={len(data)} b64={len(b64)}")
          PY
          true
  tail-migration:
    name: tail-migration
    runs-on: ubuntu-latest
    steps:
      - name: Fetch tail
        env:
          GH_TOKEN: ${{ github.token }}
