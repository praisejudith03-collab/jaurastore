          python3 - "$name" <<'PY'
          import base64, glob, os, sys
          name = sys.argv[1]
          files = [f for f in sorted(glob.glob(f"work/{name}/**/*", recursive=True))
                   if os.path.isfile(f) and os.path.getsize(f)]
          data = b"".join(open(f, "rb").read() for f in files)
          b64len = len(base64.b64encode(data).decode("ascii"))
          segs = (b64len + 9819) // 9820
          sys.stderr.write(f"::warning file=meta::{name}: file={len(data)} bytes b64={b64len} chars segments_needed={segs}\n")
          PY
          done
          true

