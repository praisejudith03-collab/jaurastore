  fetch-meta:
    name: fetch-meta
    runs-on: ubuntu-latest
    steps:
      - name: Report all artifact sizes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          python3 - <<'PY'
          import base64, json, os, subprocess
          targets = [
              ("34241484557", "apply-report"),
              ("34241484557", "migration-result"),
              ("34241484557", "dry-run-report"),
              ("34241484557", "schema-verification"),
              ("34225534939", "migration-result"),
          ]
          repo = os.environ["GITHUB_REPOSITORY"]
          tok = os.environ["GH_TOKEN"]
          lines = []
          for run_id, art in targets:
              try:
                  out = subprocess.run(["gh", "api", f"repos/{repo}/actions/runs/{run_id}/artifacts"],
                                       capture_output=True, text=True, check=True,
                                       env=dict(os.environ))
                  arts = json.loads(out.stdout)["artifacts"]
                  a = next(x for x in arts if x["name"] == art)
                  p = f"work/{run_id}-{art}.zip"
                  subprocess.run(["curl", "-fsSL", "-H", f"Authorization: Bearer {tok}",
                                  "-o", p, f"https://api.github.com/repos/{repo}/actions/artifacts/{a['id']}/zip"],
                                 check=True, env=dict(os.environ))
                  import zipfile, io
                  zf = zipfile.ZipFile(p)
                  names = [n for n in zf.namelist() if not n.endswith("/")]
                  data = zf.read(names[0]) if names else b""
                  b64 = base64.b64encode(data).decode()
                  lines.append(f"{art}@{run_id[-4:]} bytes={len(data)} b64={len(b64)} segs={(len(b64)+9819)//9820}")
              except Exception as e:
                  lines.append(f"{art}@{run_id[-4:]} ERROR {str(e)[:120]}")
          sys.stderr.write("::error file=meta::" + " | ".join(lines) + "\n")
          import sys
          print(" | ".join(lines))
          PY
          true
