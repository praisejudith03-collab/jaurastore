name: Fetch migration artifacts (temporary, read-only)

# TEMPORARY read-only helper: re-assembles artifact files from finished runs on
# main by emitting them as check-run annotations. Deletes itself after use.
# No repository secrets are passed in; no Supabase access; nothing uploaded.

on:
  push:
    branches:
      - "arena/01a080a7-jaurastore"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fetch-migration-artifacts
  cancel-in-progress: false

jobs:
  fetch-apply-0:
    name: fetch-apply-0
    runs-on: ubuntu-latest
    steps:
      - name: Fetch segment and emit b64 chunks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "34241484557"
          ART: "apply-report"
          SEG: "0"
        run: |
          mkdir -p work
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts" > work/arts.json 2> work/err.log \
            || { echo "::error file=diag::gh api failed: $(head -c 300 work/err.log)"; exit 1; }
          id=$(python3 -c "import json,os; d=json.load(open('work/arts.json')); print(next((a['id'] for a in d['artifacts'] if a['name']==os.environ['ART']),''))")
          if [ -z "$id" ]; then
            echo "::error file=diag::ARTIFACT-NOT-FOUND: $ART"
            exit 0
          fi
          curl -fsSL --retry 3 --max-time 300 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "work/$ART.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
            || { echo "::error file=diag::curl failed for $ART"; exit 1; }
          mkdir -p "work/$ART"
          unzip -o -q "work/$ART.zip" -d "work/$ART" || { echo "::error file=diag::unzip failed for $ART"; exit 1; }
          echo "files:"; find "work/$ART" -type f | sort
          python3 - "$ART" <<'PY'
          import base64, glob, os, sys
          art = sys.argv[1]
          files = [f for f in sorted(glob.glob(f"work/{art}/**/*", recursive=True))
                   if os.path.isfile(f) and os.path.getsize(f)]
          if not files:
              print("no files under", art)
              sys.exit(0)
          data = b"\n".join(open(f, "rb").read() for f in files)
          b64 = base64.b64encode(data).decode("ascii")
          seg, seg_w, chunk_w = int(os.environ["SEG"]), 9820, 982
          start = seg * seg_w
          part = b64[start:start + seg_w]
          print(f"b64 total {len(b64)}; segment {seg}: {len(part)} chars; filebytes {len(data)}")
          i = 0
          for off in range(0, len(part), chunk_w):
              i += 1
              chunk = part[off:off + chunk_w]
              sys.stderr.write(f"::error file=artifact-b64::chunk {i}: {chunk}\n")
          print(f"emitted {i} chunk(s)")
          PY
          true
