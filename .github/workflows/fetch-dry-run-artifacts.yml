  fetch-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Report artifact sizes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          ART_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.name)"')
          for name in dry-run-report schema-verification; do
            id=$(awk -v name="$name" '$2 == name {print $1}' <<< "$ART_IDS")
            mkdir -p "work/$name"
            curl -fsSL --retry 3 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "work/$name.zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
