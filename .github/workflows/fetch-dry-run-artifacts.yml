name: Fetch dry-run artifacts (read-only helper)

# ONE-OFF READ-ONLY HELPER (temporary - deleted after the verification run)
# ------------------------
# Some agent sandboxes cannot reach the Azure blob cluster that stores
# Actions artifacts. This helper runs where the network CAN reach it: it
# downloads the artifacts of a previous run and makes their full contents
# readable from API-only contexts.
#
# TRANSPORT: GitHub stores at most 10 check annotations per check run, and
# each annotation message is capped at 1024 chars. So each job (= one check
# run) emits up to 10 chunks of 982 base64 chars = one 9820-char b64
# segment. Jobs cover consecutive segments of each artifact's base64
# encoding; reassemble by concatenating, in (job, chunk) order, then
# base64-decode.
#
# GUARANTEES (by construction):
#   * No repository secrets are passed in - the job has NO Supabase access.
#   * migrate_images.py / verify_schema.py are NEVER executed here.
#   * Nothing is uploaded; nothing in Supabase (DB or Storage) is touched.

on:
  # TEMPORARY (this session only): run on pushes to the session branch so an
  # agent sandbox without actions:write can trigger it. The helper file is
  # deleted again once the verification run has completed.
  push:
    branches:
      - "arena/01a080a7-jaurastore"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id to fetch artifacts from (this repository)"
        required: false
        type: string
        default: "34212824430"

permissions:
  contents: read
  actions: read     # needed to download artifacts of a previous run

concurrency:
  group: fetch-dry-run-artifacts
  cancel-in-progress: false

env:
  TARGET_RUN_ID: ${{ inputs.run_id || '34212824430' }}
  SEG_W: "9820"          # b64 chars per job (10 chunks x 982)
  CHUNK_W: "982"         # b64 chars per annotation chunk

jobs:
  fetch-dry-0:
    runs-on: ubuntu-latest
    env:
      ART: "dry-run-report"
      SEG: "0"
    steps:
      - name: Fetch segment and emit b64 chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          ART_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.name)"')
          id=$(awk -v name="$ART" '$2 == name {print $1}' <<< "$ART_IDS")
          if [ -z "$id" ]; then
            echo "ARTIFACT-NOT-FOUND: $ART"
            exit 0
          fi
          curl -fsSL --retry 3 --max-time 300 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "work/$ART.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
          mkdir -p "work/$ART"
          unzip -o -q "work/$ART.zip" -d "work/$ART"
          echo "files:"; find "work/$ART" -type f | sort
          python3 - "$ART" <<'PY'
          import base64, glob, os, sys
          art = sys.argv[1]
          files = [f for f in sorted(glob.glob(f"work/{art}/**/*", recursive=True))
                   if os.path.isfile(f) and os.path.getsize(f)]
          if not files:
              print("no files under", art)
              sys.exit(0)
          data = b"\n".join(open(f, "rb").read() for f in files)
          b64 = base64.b64encode(data).decode("ascii")
          seg, seg_w, chunk_w = int(os.environ["SEG"]), int(os.environ["SEG_W"]), int(os.environ["CHUNK_W"])
          start = seg * seg_w
          part = b64[start:start + seg_w]
          if not part:
              print(f"segment {seg}: empty (b64 total {len(b64)}) - nothing to emit")
              sys.exit(0)
          print(f"b64 total {len(b64)}; segment {seg}: {len(part)} chars")
          i = 0
          for off in range(0, len(part), chunk_w):
              i += 1
              chunk = part[off:off + chunk_w]
              sys.stderr.write(f"::error file=artifact-b64::chunk {i}: {chunk}\n")
          print(f"emitted {i} chunk(s)")
          PY
          true

