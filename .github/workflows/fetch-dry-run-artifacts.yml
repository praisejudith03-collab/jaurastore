  fetch-meta:
    name: fetch-meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RUN_A: "34241484557"
      RUN_B: "34225534939"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report all artifact sizes
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, base64
          targets = [
              (os.environ["RUN_A"], "apply-report"),
              (os.environ["RUN_A"], "migration-result"),
              (os.environ["RUN_A"], "dry-run-report"),
              (os.environ["RUN_A"], "schema-verification"),
              (os.environ["RUN_B"], "migration-result"),
          ]
          seg_w = 9820
          lines = []
          for run_id, art in targets:
              d = pathlib.Path("/tmp/m-" + run_id + "-" + art)
              d.mkdir(parents=True, exist_ok=True)
              subprocess.run(["gh", "run", "download", run_id, "--name", art, "--dir", str(d)],
                             check=True, env=dict(os.environ))
              files = [f for f in d.rglob("*") if f.is_file()]
              raw = files[0].read_bytes() if files else b""
              b64 = base64.b64encode(raw).decode()
              lines.append(art + "@" + run_id[-4:] + " bytes=" + str(len(raw)) +
                           " b64=" + str(len(b64)) + " segs=" + str((len(b64) + seg_w - 1) // seg_w))
          print("::warning file=meta::" + " | ".join(lines))
          PY
