name: Fetch dry-run artifacts (read-only helper)

# ONE-OFF READ-ONLY HELPER (temporary - deleted after the verification run)
# ------------------------
# Some agent sandboxes cannot reach the Azure blob cluster that stores
# Actions artifacts. This helper runs where the network CAN reach it: it
# downloads the artifacts of a previous run and makes their full contents
# readable from API-only contexts. Content channels, in order of preference:
#   1. check-run output.text  (PATCH checks API - needs checks:write)
#   2. check annotations      (written by the runner, needs no token scopes)
#   3. issue body             (needs issues:write)
#
# GUARANTEES (by construction):
#   * No repository secrets are passed in - the job has NO Supabase access.
#   * migrate_images.py / verify_schema.py are NEVER executed here.
#   * Nothing is uploaded; nothing in Supabase (DB or Storage) is touched.

on:
  # TEMPORARY (this session only): run on pushes to the session branch so an
  # agent sandbox without actions:write can trigger it. The helper file is
  # deleted again once the verification run has completed.
  push:
    branches:
      - "arena/01a080a7-jaurastore"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id to fetch artifacts from (this repository)"
        required: false
        type: string
        default: "34212824430"
      artifact_names:
        description: "Comma-separated artifact names to fetch"
        required: false
        type: string
        default: "dry-run-report,schema-verification"
      issue_title:
        description: "Title of the issue that will receive the contents"
        required: false
        type: string
        default: "[verification] run 34212824430 artifact contents"
      issue_label:
        description: "Label to add to the issue"
        required: false
        type: string
        default: "verification"

permissions:
  contents: read
  actions: read     # needed to download artifacts of a previous run
  checks: write     # channel 1: check-run output
  issues: write     # channel 3: issue body

concurrency:
  group: fetch-dry-run-artifacts
  cancel-in-progress: false

env:
  TARGET_RUN_ID: ${{ inputs.run_id || '34212824430' }}
  TARGET_ARTIFACTS: ${{ inputs.artifact_names || 'dry-run-report,schema-verification' }}
  TARGET_ISSUE_TITLE: ${{ inputs.issue_title || '[verification] run 34212824430 artifact contents' }}
  TARGET_ISSUE_LABEL: ${{ inputs.issue_label || 'verification' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the artifacts of run ${{ env.TARGET_RUN_ID }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          # List the run's artifacts, then fetch each requested one's zip
          # straight from the API (302 -> signed URL -> blob; the runner can
          # reach the blob cluster). No git checkout needed, unlike
          # `gh run download`.
          ART_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.name)"')
          IFS=',' read -ra NAMES <<< "$TARGET_ARTIFACTS"
          for n in "${NAMES[@]}"; do
            [ -n "$n" ] || continue
            idline=$(grep " $n\$" <<< "$ART_IDS" || true)
            id=$(awk '{print $1}' <<< "$idline")
            if [ -z "$id" ]; then
              echo "ARTIFACT-NOT-FOUND: $n"; continue
            fi
            mkdir -p "artifacts/$n"
            if curl -fsSL --retry 3 --max-time 300 \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -o "artifacts/$n.zip" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
                 2> "download-errors.$n"; then
              if ! unzip -o -q "artifacts/$n.zip" -d "artifacts/$n" \
                   2>> "download-errors.$n"; then
                echo "UNZIP-FAILED: $n"
              fi
              rm -f "artifacts/$n.zip"
            else
              echo "DOWNLOAD-FAILED: $n"; cat "download-errors.$n"
            fi
          done
          echo "--- files fetched ---"
          find artifacts -type f | sort
          true

      - name: Publish the contents (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Read-only helper output: full contents of the artifacts of"
            echo "run $TARGET_RUN_ID in $GITHUB_REPOSITORY (helper run"
            echo "${{ github.run_id }}, job status ${{ job.status }}). Posted"
            echo "verbatim for verification. No secrets are included (this"
            echo "job has no access to any repository secrets, and the"
            echo "migration scripts were not run)."
            echo ""
            for e in download-errors.*; do
              [ -s "$e" ] || continue
              echo "Download problems for $(basename "$e"):"
              echo "\`\`\`"
              cat "$e"
              echo "\`\`\`"
              echo ""
            done
            while IFS= read -r f; do
              [ -s "$f" ] || continue
              echo "<!-- file: $f -->"
              echo "\`\`\`json path=\"$f\""
              cat "$f"
              echo "\`\`\`"
              echo ""
            done < <(find artifacts -type f | sort)
            echo "_Files: $(find artifacts -type f | wc -l)"
          } > issue-body.md
          echo "body bytes: $(wc -c < issue-body.md)"

          # Channel 1: check-run output text (limit 65536 chars)
          CH1=0
          if [ -n "${CHECK_RUN_ID:-}" ] \
             && gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" \
                  -f "output.title=artifact contents (run $TARGET_RUN_ID)" \
                  -F "output.text=@issue-body.md" > channel1.log 2>&1; then
            CH1=1
            echo "CHANNEL1-CHECK-OUTPUT: ok"
          else
            echo "CHANNEL1-CHECK-OUTPUT: failed"
            cat channel1.log 2>/dev/null || true
          fi

          # Channel 2: payload as runner-written annotations (no scopes needed)
          if [ "$CH1" = 1 ]; then
            echo "CHANNEL2-ANNOTATIONS: skipped (channel 1 ok)"
          else
            echo "CHANNEL2-ANNOTATIONS: emitting payload"
            i=0
            while IFS= read -r line; do
              i=$((i + 1))
              printf '::error file=artifact-payload::chunk %d: %s\n' "$i" "$line"
            done < <(fold -w 850 issue-body.md)
          fi

          # Channel 3: issue body (bonus, best effort)
          if ISSUE_URL=$(gh issue create \
              --title "$TARGET_ISSUE_TITLE (helper run ${{ github.run_id }})" \
              --body "$(cat issue-body.md)" --json url -q .url 2> channel3.log); then
            echo "CHANNEL3-ISSUE: ok $ISSUE_URL"
            gh issue edit "$ISSUE_URL" --add-label "$TARGET_ISSUE_LABEL" 2>/dev/null || true
          else
            echo "CHANNEL3-ISSUE: failed"
            head -c 400 channel3.log || true
          fi
          true
