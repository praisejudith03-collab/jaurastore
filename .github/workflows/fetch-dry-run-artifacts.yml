name: Fetch dry-run artifacts (read-only helper)

# ONE-OFF READ-ONLY HELPER (temporary - deleted after the verification run)
# ------------------------
# Some agent sandboxes cannot reach the Azure blob cluster that stores
# Actions artifacts. This helper runs where the network CAN reach it: it
# downloads the artifacts of a previous run and posts their full contents
# into a GitHub issue so an operator (or agent) with API access can inspect
# them.
#
# GUARANTEES (by construction):
#   * No repository secrets are passed in - the job has NO Supabase access.
#   * migrate_images.py / verify_schema.py are NEVER executed here.
#   * Nothing is uploaded; nothing in Supabase (DB or Storage) is touched.
#   * The only write is one issue body in this repository.

on:
  # TEMPORARY (this session only): run on pushes to the session branch so an
  # agent sandbox without actions:write can trigger it. The helper file is
  # deleted again once the verification run has completed.
  push:
    branches:
      - "arena/01a080a7-jaurastore"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id to fetch artifacts from (this repository)"
        required: false
        type: string
        default: "34212824430"
      artifact_names:
        description: "Comma-separated artifact names to fetch"
        required: false
        type: string
        default: "dry-run-report,schema-verification"
      issue_title:
        description: "Title of the issue that will receive the contents"
        required: false
        type: string
        default: "[verification] run 34212824430 artifact contents"
      issue_label:
        description: "Label to add to the issue"
        required: false
        type: string
        default: "verification"

permissions:
  contents: read
  actions: read     # needed to download artifacts of a previous run
  issues: write     # needed to post the contents into an issue

concurrency:
  group: fetch-dry-run-artifacts
  cancel-in-progress: false

env:
  TARGET_RUN_ID: ${{ inputs.run_id || '34212824430' }}
  TARGET_ARTIFACTS: ${{ inputs.artifact_names || 'dry-run-report,schema-verification' }}
  TARGET_ISSUE_TITLE: ${{ inputs.issue_title || '[verification] run 34212824430 artifact contents' }}
  TARGET_ISSUE_LABEL: ${{ inputs.issue_label || 'verification' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download the artifacts of run ${{ env.TARGET_RUN_ID }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          : > download-errors.log
          IFS=',' read -ra NAMES <<< "$TARGET_ARTIFACTS"
          for n in "${NAMES[@]}"; do
            [ -n "$n" ] || continue
            mkdir -p "artifacts/$n"
            if ! gh run download "$TARGET_RUN_ID" -n "$n" -D "artifacts/$n" \
                > "download-errors.log.$n" 2>&1; then
              echo "DOWNLOAD-FAILED: $n"
              cat "download-errors.log.$n"
              cat "download-errors.log.$n" >> download-errors.log
            fi
          done
          echo "--- files fetched ---"
          find artifacts -type f | sort
          true

      - name: Post the results into a GitHub issue (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ job.status }}"
          {
            echo "Read-only helper output for artifacts of run $TARGET_RUN_ID "
            echo "in $GITHUB_REPOSITORY (helper run ${{ github.run_id }}, "
            echo "status: $STATUS). Posted verbatim for verification. No "
            echo "secrets are included (this job has no access to any "
            echo "repository secrets, and the migration scripts were not "
            echo "run)."
            echo ""
            if [ -s download-errors.log ]; then
              echo "Download problems:"
              echo "\`\`\`"
              cat download-errors.log
              echo "\`\`\`"
              echo ""
            fi
            while IFS= read -r f; do
              [ -s "$f" ] || continue
              echo "<!-- file: $f -->"
              echo "\`\`\`json path=\"$f\""
              cat "$f"
              echo "\`\`\`"
              echo ""
            done < <(find artifacts -type f | sort)
            echo "_File list:_ $(find artifacts -type f | wc -l) file(s)."
          } > issue-body.md
          BODY=$(cat issue-body.md)
          ISSUE_URL=$(gh issue create \
            --title "$TARGET_ISSUE_TITLE (helper status: $STATUS)" \
            --body "$BODY" --json url -q .url)
          gh issue edit "$ISSUE_URL" --add-label "$TARGET_ISSUE_LABEL" \
            2>/dev/null || true   # label is cosmetic; missing label is fine
          echo "Issue created: $ISSUE_URL"
          echo "::notice::Results posted to: $ISSUE_URL"
