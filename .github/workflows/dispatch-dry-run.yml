name: Dispatch image-migration dry-run (one-off)

# One-off helper: the review sandbox's token cannot create workflow_dispatch
# events (HTTP 403, missing actions:write on the App), so this push-triggered
# job dispatches the protected dry-run on main using the repository's own
# GITHUB_TOKEN. workflow_dispatch is explicitly exempt from the GITHUB_TOKEN
# "no recursive workflows" rule, so this is the supported path.
#
# The dispatched run is NOT weakened in any way: it still targets the
# image-migration required-reviewer environment, still defaults to a dry run,
# and still cannot apply anything (dry_run=true is passed explicitly).

on:
  push:
    branches: [arena/01a0805d-jaurastore]
    paths: ['.github/workflows/dispatch-dry-run.yml']

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the protected dry-run on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run "Image migration (manual, protected)" \
            --repo "$REPO" --ref main \
            -f dry_run=true \
            -f confirm_apply= \
            -f limit=0 \
            -f live_only=false
          sleep 10
          echo "=== latest runs of the protected workflow ==="
          gh run list --workflow="Image migration (manual, protected)" \
            --repo "$REPO" --limit 2 \
            --json databaseId,status,conclusion,headBranch,event,createdAt
