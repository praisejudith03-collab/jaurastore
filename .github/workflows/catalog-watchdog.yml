# Catalog watchdog: the storefront may never silently lose a product.
#
# Hourly, it runs tools/catalog_watchdog.py autonomously. A manual dispatch
# remains available for diagnostics, but normal operation never needs it.
# It compares the live storefront (GET https://jaurastore.com.ng/api/catalog)
# against the Supabase products table read DIRECTLY over PostgREST, and fails
# when:
#   - an online Supabase row is missing from the public catalogue for two
#     CONSECUTIVE runs (the "258 in Supabase, 241 in the browser" defect
#     class; one run of missing only WARNs, so deploys and cache edges do
#     not page the owner),
#   - a served row is not online in Supabase,
#   - the live catalogue collapses between runs (a fifth or more at once),
#   - the response looks like the bundled js/products-data.js fallback rather
#     than Supabase.
#
# It is READ-ONLY against production. Retiring a product is normal shopkeeping
# and never alerts: taking rows offline or deleting them is the owner's call,
# and products on the app's durable deleted-ids list (growth_settings
# deleted_product_ids_json) are reported as intentional, never as missing.
#
# On failure it opens (or comments on) a "Catalog watchdog" issue, which is the
# shop owner's alert. On recovery it comments and closes the issue.
#
# Notes:
#   * Scheduled workflows run only on the default branch. GitHub disables a
#     cron workflow after 60 days with no repository activity - any commit,
#     including a README touch, re-enables it.
#   * Retiring products needs no code change. A large bulk retirement alerts
#     once (the shrink guard), then the new size becomes the baseline.
#   * The hourly cadence plus the two-run tolerance means a real defect pages
#     within about two hours; a transient one never does.
#   * Needs the repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
#     (Settings -> Secrets and variables -> Actions). The key is never printed.
name: Catalog watchdog

on:
  schedule:
    # Fully autonomous: hourly (UTC). The watchdog's own missing-streak
    # tolerance adds one more run of grace, so a real defect pages within
    # ~2 hours while transient mismatches never page at all.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WATCHDOG_BASE_URL: https://jaurastore.com.ng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The shrink guard compares against the previous run's product count.
      # A miss (first run, evicted cache) simply skips that one check.
      - name: Restore the previous run's catalogue size
        uses: actions/cache/restore@v4
        with:
          path: .watchdog-state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: watchdog-state-
      - name: Run the catalog watchdog
        run: |
          # The Python task has bounded per-request retries. Leave a margin for
          # issue reporting instead of letting Actions kill the whole job.
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 9m \
            python3 tools/catalog_watchdog.py 2>&1 | tee watchdog.log
      - name: Save the catalogue size for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog-state.json
          key: watchdog-state-${{ github.run_id }}
      - name: Open or update the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          {
            echo "The production catalog watchdog failed on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```'
            cat watchdog.log
            echo '```'
            echo
            echo "This issue was opened automatically. Investigate before unpublishing/deleting anything else, and close it once the catalogue is back to full strength."
          } > issue-body.md
          NUMBER=$(gh issue list --state open --search "in:title Catalog watchdog" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file issue-body.md
          else
            gh issue create --title "Catalog watchdog: products missing from the storefront" --body-file issue-body.md
          fi
      - name: Close the alert issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NUMBER=$(gh issue list --state open --search "in:title Catalog watchdog" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "Watchdog passed again at $(date -u '+%Y-%m-%d %H:%M UTC') - the catalogue is back to full strength. Closing automatically."
            gh issue close "$NUMBER"
          fi
