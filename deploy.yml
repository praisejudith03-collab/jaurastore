name: Deploy

# Two environments, one repository:
#   develop  -> jaurastore-staging     (preview, safe to break)
#   main     -> jaurastore-production  (the live shop)
# Add each Render service's Deploy Hook URL as a repository secret:
#   RENDER_DEPLOY_HOOK_STAGING / RENDER_DEPLOY_HOOK_PRODUCTION
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m pytest tests/test_api.py -q

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render (staging)
        run: curl -fsS -X POST "$RENDER_HOOK"
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render (production)
        run: curl -fsS -X POST "$RENDER_HOOK"
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}
