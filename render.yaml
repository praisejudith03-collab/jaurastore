# Render blueprint — free-tier option-1 architecture.
#
# This file intentionally defines ONE web service only. Abandoned-cart
# reminders, maintenance, backups and supplier stock checks run inside that web
# process (scheduler.py) instead of separate Render background workers, so the
# workspace does not double-count instance hours.
services:
  - name: jaurastore
    type: web
    runtime: python
    repo: https://github.com/praisejudith03-collab/jaurastore
    branch: main
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # Gunicorn replaces a silent worker after 45s; Render separately removes
    # an unhealthy instance from traffic and restarts it after its health-check
    # failure window. /healthz returns within 5s and fails closed on DB hangs.
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 8 --worker-class gthread --timeout 45 --graceful-timeout 30 --keep-alive 5
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: jaurastore@gmail.com
      - key: SITE_ORIGIN
        value: https://jaurastore.com.ng
      # Keep the single free web service warm. With exactly one service this is
      # at most one instance-hour at a time instead of one web + N workers.
      - key: KEEP_ALIVE
        value: "1"
      - key: SCHEDULER_ENABLED
        value: "1"
      - key: SUPPLIER_WATCHDOG_ENABLED
        value: "1"
      - key: SUPPLIER_WATCHDOG_BATCH
        value: "8"
      # reCAPTCHA v2 Invisible (public site key + private secret).
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # Permanent admin authentication. Set in Render; never stored in git.
      - key: ADMIN_MASTER_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Supabase is the production source of truth for products, carts, orders,
      # receipts, categories and admin auth. Service role key is server-only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Free Render services have ephemeral disks; SQLite/JSON are boot caches
      # restored from Supabase and safe to keep under /tmp.
      - key: DB_PATH
        value: /tmp/jaura.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CATALOG_PATH
        value: /tmp/catalog.json
      - key: UPLOAD_MODE
        value: supabase
      # GitHub dual-sync for admin product/category changes.
      - key: GITHUB_REPOSITORY
        value: praisejudith03-collab/jaurastore
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_COMMITTER
        value: jaurastore@gmail.com
      - key: GITHUB_TOKEN
        sync: false
      # WhatsApp order alerts.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_CALLMEBOT_KEY
        sync: false
      # Shop email over HTTPS providers first (Render blocks SMTP on many plans).
      - key: MAIL_FROM
        value: orders@jaurastore.com.ng
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
