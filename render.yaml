# Render blueprint - creates the staging and production services from one repo.
# Dashboard -> New -> Blueprint, then point it at this repo.
services:
  - name: jaurastore-staging
    type: web
    runtime: python
    repo: https://github.com/praisejudith03-collab/jaurastore
    branch: develop
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 2 --timeout 90
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        value: jaurastore@gmail.com
      - key: MAIL_MODE
        value: smtp
      - key: MAIL_FROM
        value: jaurastore@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: jaurastore@gmail.com
      # set SMTP_PASS in the dashboard (sync: false keeps the secret out of git)
      - key: SMTP_PASS
        sync: false
      - key: SITE_ORIGIN
        value: https://jaurastore-staging.onrender.com
      # Keep the free host awake: the scheduler pings SITE_ORIGIN/healthz on
      # each tick when KEEP_ALIVE is on (default: on when SITE_ORIGIN is set).
      - key: KEEP_ALIVE
        value: "1"
      # Google reCAPTCHA v2 INVISIBLE badge. There is no "I'm not a robot" box:
      # the widget renders with size:"invisible" and mints a token on submit.
      # Site label: Jaura Store checkout v2 — type: reCAPTCHA v2 Invisible,
      # domains: jaurastore.com.ng AND www.jaurastore.com.ng.
      # https://www.google.com/recaptcha/admin — set both keys in the Render
      # dashboard; sync:false keeps the secret out of git. A v3 key here makes
      # the widget say "Invalid key type". Do NOT set RECAPTCHA_REQUIRED.
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      # Emergency admin recovery ONLY — leave it empty. While it is empty,
      # auth.apply_bootstrap_password() is inert, so nothing is ever forced.
      # To use it: set a value, reboot once, sign in, change the password from
      # Admin -> My account, then clear the variable again.
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Supabase (source of truth for products, carts, orders, admin auth).
      # The service role key is server-side only: sync:false keeps it out of git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # the SQLite database and uploaded proofs live here - keep this disk
      # mounted or the data resets on every deploy
      - key: DB_PATH
        value: /var/data/jaura.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Durable uploads live in Supabase storage. Left unset the app falls
      # back to the service filesystem, which Render wipes on every deploy.
      - key: UPLOAD_MODE
        value: supabase
      # admin products - MUST sit on the disk or they vanish on every deploy
      - key: CATALOG_PATH
        value: /var/data/catalog.json
      # GitHub dual-sync: after admin product/category changes, the app
      # regenerates the repository data files and commits/pushes them so the
      # repo stays in sync with Supabase. GITHUB_TOKEN is a secret.
      - key: GITHUB_REPOSITORY
        value: praisejudith03-collab/jaurastore
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_COMMITTER
        value: jaurastore@gmail.com
      - key: GITHUB_TOKEN
        sync: false
      # WhatsApp order alerts to the shop owner (+229 01 68 95 31 01).
      # Use EITHER the Meta Cloud API pair (WHATSAPP_TOKEN + WHATSAPP_PHONE_ID)
      # OR the simpler CallMeBot key — set whichever you have in the dashboard.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_CALLMEBOT_KEY
        sync: false
    disk:
      name: jaura-staging-data
      mountPath: /var/data
      sizeGB: 1

  - name: jaurastore-production
    type: web
