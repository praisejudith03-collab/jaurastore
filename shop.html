<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="canonical" href="https://jaurastore.com.ng/shop.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jaura Store" />
  <meta property="og:title" content="All Products · Jaura Store" />
  <meta property="og:description" content="Browse 250+ pieces at Jaura Store. Filter by category, colour and size. Pay in ₦ or F CFA." />
  <meta property="og:url" content="https://jaurastore.com.ng/shop.html" />
  <meta property="og:image" content="https://jaurastore.com.ng/images/brand/og-cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="All Products · Jaura Store" />
  <meta name="twitter:description" content="Browse 250+ pieces at Jaura Store. Filter by category, colour and size. Pay in ₦ or F CFA." />
  <meta name="twitter:image" content="https://jaurastore.com.ng/images/brand/og-cover.jpg" />
  <link rel="icon" type="image/png" href="images/brand/favicon.png" />
  <link rel="apple-touch-icon" href="images/brand/apple-touch.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=118" />
</head>
<body data-page="shop" class="wix-shop">
  <div id="site-header"></div>
  <div class="shop-page">
    <div class="wrap">
      <p class="crumbs"><a href="index.html" data-i18n="nav.home">Home</a> <span>›</span> <span data-shop-title>All Products</span></p>
      <div class="shop-banner">
        <img src="images/banners/wordmark-bg.jpg" alt="" />
        <p class="shop-script">Jaura Store</p>
      </div>
      <h1 class="shop-title" data-shop-title>All Products</h1>
      <div class="cat-pills" data-filters></div>
      <div class="shop-meta">
        <span data-shop-count></span>
        <div class="shop-meta-actions">
          <button type="button" class="shop-filter-btn" data-open-filter data-i18n="shop.filter" aria-label="Filter">Filter</button>
          <select data-sort>
          <option value="newest" data-i18n="shop.newest">Newest</option>
          <option value="price-asc" data-i18n="shop.priceAsc">Price · low to high</option>
          <option value="price-desc" data-i18n="shop.priceDesc">Price · high to low</option>
          <option value="name" data-i18n="shop.name">Name</option>
        </select>
        </div>
      </div>
      <div class="product-grid" data-shop-grid></div>
      <div class="pager" data-pager></div>
    </div>
  </div>
  <div class="filt-mask" data-filt-mask hidden></div>
  <aside class="filt-draw" data-filt-draw hidden>
    <div class="filt-head">
      <button type="button" class="filt-close" data-close-filter data-i18n="filt.close">✕ Close</button>
    </div>
    <div class="filt-body" data-filt-body></div>
  </aside>
  <section class="wrap" data-most-viewed aria-label="Most viewed products"></section>
  <div id="site-footer"></div>
  <script src="js/products-data.js?v=118"></script>
  <script src="js/i18n-phrases.js?v=118"></script>
  <script src="js/i18n.js?v=118"></script>
  <script src="js/net.js?v=118"></script>
  <script src="js/store.js?v=118"></script>
  <script src="js/app.js?v=118"></script>
</body>
</html>
